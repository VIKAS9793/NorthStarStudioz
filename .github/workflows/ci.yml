# The site is served by Cloudflare Pages, which deploys website/ from main on
# its own. This workflow only verifies; it deploys nothing.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs may stop early; runs on main always finish, so every
  # pushed commit gets its ownership check.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify build & security guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Rebuild bundle and confirm it matches the committed file
        run: |
          npm run build
          git diff --exit-code -- website/assets/js/ || {
            echo "::error::website/assets/js/gate-3d.js does not match a fresh build of src/. Run 'npm run build' and commit the result."
            exit 1
          }

      - name: Check CSP hashes, external resources and unsafe DOM APIs
        run: npm run verify

  lighthouse:
    name: Lighthouse budget (mobile)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      # Mobile preset, median of three runs per page, on the runner's Chrome.
      - name: Check every page against the performance budget
        run: npm run lighthouse

  ownership:
    name: Owner-only authorship
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every new commit is the owner's, with no AI attribution
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE_REF..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE..$HEAD_SHA"
          else
            RANGE="$HEAD_SHA~1..$HEAD_SHA"
          fi
          node scripts/attribution-guard.mjs --range "$RANGE"
