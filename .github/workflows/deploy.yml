name: Verify & deploy website

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; each job asks only for what it needs.
permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify build & security guardrails
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies (no install scripts)
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Rebuild bundle and confirm it matches the committed file
        run: |
          npm run build
          git diff --exit-code -- website/assets/js/ || {
            echo "::error::website/assets/js/gate-3d.js does not match a fresh build of src/. Run 'npm run build' and commit the result."
            exit 1
          }

      - name: Check CSP hashes, external resources and unsafe DOM APIs
        run: npm run verify

      - name: Build the GitHub Pages redirect pages
        run: node scripts/gh-pages-redirects.mjs

  ownership:
    name: Owner-only authorship
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Every new commit is the owner's, with no AI attribution
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE_REF..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE..$HEAD_SHA"
          else
            RANGE="$HEAD_SHA~1..$HEAD_SHA"
          fi
          node scripts/attribution-guard.mjs --range "$RANGE"

  # The site itself is served by Cloudflare Pages, which deploys website/ from
  # main on its own. GitHub Pages only keeps old github.io links working by
  # redirecting them to https://northstarstudioz.space.
  deploy:
    name: Deploy redirects to GitHub Pages
    needs: [verify, ownership]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the redirect pages
        run: node scripts/gh-pages-redirects.mjs

      - name: Upload redirect pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gh-pages-redirects

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
